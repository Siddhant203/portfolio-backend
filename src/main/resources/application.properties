spring.application.name=portfolio-backend

# Database Configuration (Environment Variables with Localhost Fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Admin Credentials (Fallback for Local Testing, Override in Cloud)
ADMIN_USERNAME=${ADMIN_USERNAME:admin}
ADMIN_PASSWORD=${ADMIN_PASSWORD:admin123}
